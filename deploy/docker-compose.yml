# Deploy lên VPS: MCP bridge server + Caddy (tự động HTTPS qua Let's Encrypt).
#
#   1. Trỏ domain (vd: chrome.example.com) về IP VPS
#   2. Tạo file .env cạnh file này:
#        DOMAIN=chrome.example.com
#        CC_CHROME_PAIR_SECRET=<secret>                   # openssl rand -hex 16
#        # tùy chọn, cấp token tĩnh thủ công:
#        # CC_CHROME_TOKENS=<token1>=alice,<token2>=bob
#   3. docker compose up -d --build
#
# Sau đó mỗi thành viên chỉ cần chạy trong Claude Code:
#   /ccchrome connect https://chrome.example.com
# (nhập CC_CHROME_PAIR_SECRET khi được hỏi — lệnh tự sinh token, tự cấu hình
#  MCP, và hướng dẫn dán URL vào extension)

services:
  chrome-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CC_CHROME_TOKENS: ${CC_CHROME_TOKENS:-}
      CC_CHROME_PAIR_SECRET: ${CC_CHROME_PAIR_SECRET:-}
      CC_CHROME_STATE_FILE: /data/ccchrome-tokens.json
      CC_CHROME_DIST_DIR: /app/dist
    volumes:
      - bridge_data:/data
      # Chạy `npm run build` ở gốc repo trước khi deploy để team tải extension
      # tại https://<domain>/extension.zip (thiếu thì endpoint trả 404).
      - ../dist:/app/dist:ro
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  bridge_data:
  caddy_data:
  caddy_config:
