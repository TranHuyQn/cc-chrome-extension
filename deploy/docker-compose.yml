# Deploy lên VPS: MCP bridge server + Caddy (tự động HTTPS qua Let's Encrypt).
#
#   1. Trỏ domain (vd: chrome.example.com) về IP VPS
#   2. Tạo file .env cạnh file này:
#        DOMAIN=chrome.example.com
#        CC_CHROME_TOKENS=<token1>=alice,<token2>=bob     # openssl rand -hex 16
#   3. docker compose up -d --build
#
# Sau đó mỗi thành viên:
#   - Claude Code:  claude mcp add --scope user --transport http chrome \
#                     https://chrome.example.com/mcp \
#                     --header "Authorization: Bearer <token-cua-minh>"
#   - Extension:    bấm icon extension -> đổi URL thành
#                     wss://chrome.example.com/ws?token=<token-cua-minh>

services:
  chrome-bridge:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    restart: unless-stopped
    environment:
      CC_CHROME_TOKENS: ${CC_CHROME_TOKENS}
    expose:
      - "8787"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      DOMAIN: ${DOMAIN}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
