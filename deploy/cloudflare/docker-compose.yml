# Deploy sau Cloudflare Tunnel (home server, không mở port ra internet).
#
# Khác với deploy/docker-compose.yml: KHÔNG có Caddy. Cloudflare đã lo TLS ở
# biên. Và cloudflared ở đây chạy TRONG Docker, nên bridge không publish cổng
# nào ra host cả — cloudflared gọi thẳng vào container qua tên service.
#
#   Claude Code / Chrome ──HTTPS/WSS──► Cloudflare ──tunnel──► container cloudflared
#                                                                      │
#                                                     http://chrome-bridge:8787
#                                                     (cùng docker network)
#                                                                      ▼
#                                                              container này
#
# Hướng dẫn đầy đủ: docs/deploy-cloudflare-tunnel.md
#
#   cd deploy/cloudflare
#   cp .env.example .env     # rồi sửa
#   docker compose up -d --build

# Đặt tên project rõ ràng thay vì để Docker suy ra từ tên thư mục ("cloudflare"),
# vì home server rất dễ đã có một stack trùng tên đó.
name: cc-chrome-bridge

services:
  chrome-bridge:
    build:
      context: ../..
      dockerfile: deploy/Dockerfile
    image: cc-chrome-bridge:2.0.0
    # Tên cố định để ingress của cloudflared trỏ tới được, và để `docker logs
    # chrome-bridge` gõ ngắn.
    container_name: chrome-bridge
    restart: unless-stopped
    environment:
      # Token tĩnh do admin cấp tay: "token1=alice,token2=bob"
      CC_CHROME_TOKENS: ${CC_CHROME_TOKENS:-}
      # Bật pairing tự phục vụ (/ccchrome connect). Xoá biến này đi sẽ làm MẤT
      # mọi token đã cấp qua pairing — xem mục "Bẫy đã biết" trong hướng dẫn.
      CC_CHROME_PAIR_SECRET: ${CC_CHROME_PAIR_SECRET:-}
      CC_CHROME_STATE_FILE: /data/ccchrome-tokens.json
      CC_CHROME_DIST_DIR: /app/dist
      # Bắt buộc: Cloudflare là proxy đứng trước, IP thật nằm ở X-Forwarded-For.
      # Không đặt biến này thì rate-limit sẽ gom cả team vào một IP duy nhất,
      # và /pair sẽ trả về URL http:// thay vì https://.
      CC_CHROME_TRUST_PROXY: "1"
      CC_CHROME_MAX_TOKENS: ${CC_CHROME_MAX_TOKENS:-20}
      CC_CHROME_SESSION_TTL_MS: ${CC_CHROME_SESSION_TTL_MS:-28800000}
    volumes:
      - bridge_data:/data
      # Gói extension để team tải tại https://<domain>/extension.zip.
      # Sinh bằng `npm run build` — chạy trên máy dev rồi copy sang cũng được,
      # server không cần cài node. Thiếu thì endpoint đó trả 404.
      - ../../dist:/app/dist:ro
    networks:
      # Mạng của stack chứa cloudflared. Không publish cổng nào ra host: chỉ
      # cloudflared trong cùng mạng này gọi được vào bridge, máy khác trong LAN
      # thì không. Đổi tên mạng ở khối `networks:` cuối file nếu stack của bạn
      # đặt tên khác.
      tunnel:
        aliases:
          - chrome-bridge
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8787/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  tunnel:
    external: true
    # Mạng này do stack khác tạo ra và phải đang tồn tại. Kiểm bằng:
    #   docker network ls
    #   docker inspect <tên-container-cloudflared> --format '{{range $k,$_ := .NetworkSettings.Networks}}{{$k}}{{end}}'
    name: ${CC_CHROME_TUNNEL_NETWORK:-ccrc_default}

volumes:
  bridge_data:
