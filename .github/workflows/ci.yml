name: ci

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm run lint

  # The .ps1 files cannot be syntax-checked on the maintainer's macOS machine
  # (no pwsh) and test/install-windows.test.mjs SKIPS off Windows, so without
  # this job a PowerShell syntax error could sit in the tree looking green.
  powershell-syntax:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Parse every .ps1
        shell: powershell
        run: |
          $bad = 0
          Get-ChildItem scripts\*.ps1 | ForEach-Object {
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$null, [ref]$errors) | Out-Null
            if ($errors) {
              Write-Host "FAIL  $($_.Name)"
              $errors | ForEach-Object { Write-Host "      $($_.Message)" }
              $bad++
            } else {
              Write-Host "PASS  $($_.Name)"
            }
          }
          if ($bad -gt 0) { exit 1 }

  # Measures the one unmeasured claim behind the update-handover design:
  # server/updater.js's linux branch of buildRunnerSpawn spawns the update
  # runner via `systemd-run --user --collect --unit=<name>` instead of a
  # plain detached child, reasoned — never measured, there is no Linux dev
  # machine for this project — to be the only shape that survives
  # `systemctl --user disable --now`, the exact command
  # scripts/service-unit.sh runs to stop the real bridge. ubuntu-latest is a
  # real systemd box, so this settles it here and keeps settling it on every
  # push. Arm A — a plain detached child — is the control, and it must DIE:
  # if it does not, the harness never had anything in the unit's cgroup and
  # arm C surviving proves nothing. Arm C is the property under test and must
  # SURVIVE. Arm B (`--scope`) is measured and REPORTED ONLY, and cannot fail
  # the run either way: systemd-run(1) says a scope is a unit under a slice,
  # so it is likely a sibling of the bridge unit rather than a child, and
  # asserting an expectation nobody here has measured would make this gate
  # red-by-construction while blaming a property that is intact. Every arm
  # prints its real /proc/self/cgroup, so the log carries the evidence rather
  # than an inference. Exit 2 (environment cannot run the experiment, e.g. no --user
  # bus) is treated as a failure too — a gate that silently skips is a gate
  # that lies. See scripts/probe-linux-handover.sh for the full design.
  linux-update-handover:
    runs-on: ubuntu-latest
    # The probe's own sleeps are bounded (well under a minute total), but
    # `systemctl --user` against a half-dead bus is not, and the default
    # job timeout is six hours — this keeps a stuck bus from silently
    # eating a runner for hours instead of failing loudly.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      # A GitHub runner has no login session, so `systemctl --user` normally
      # fails with "Failed to connect to bus". Lingering starts a persistent
      # user@UID.service that owns a real --user bus. This is host setup,
      # not part of what is being measured, so it lives here and not inside
      # the probe script.
      - name: Enable lingering so a --user systemd bus exists
        run: |
          sudo loginctl enable-linger "$(id -un)"
          echo "XDG_RUNTIME_DIR=/run/user/$(id -u)" >> "$GITHUB_ENV"
      - name: Probe the linux update-handover cgroup survival pattern
        run: bash scripts/probe-linux-handover.sh

  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install
      - run: npm install
        working-directory: server
      # Three package.json files, and installing at the root is not enough
      # (CLAUDE.md says so). test/ owns the MCP client SDK that session-ttl and
      # the e2e suites import; without this, session-ttl fails with
      # ERR_MODULE_NOT_FOUND. --ignore-scripts skips Playwright's browser
      # download, which is ~200MB this job never uses: every suite it runs is
      # browser-free.
      - run: npm install --ignore-scripts
        working-directory: test

      # Browser-free suites only. The playwright ones need a real Chromium with
      # the extension loaded, and on macOS additionally HEADED=1 and a visible
      # window (see CLAUDE.md), so they stay a manual step. build.test.mjs is
      # excluded on purpose too: it runs `npm run build`, which needs key.pem —
      # gitignored, and regenerating it would change the extension id.
      - run: node test/agent-session.test.mjs
      - run: node test/session-ttl.test.mjs
      - run: node test/reconnect-grace.test.mjs
      - run: node test/panel-auth.test.mjs
      - run: node test/panel-protocol.test.mjs

      # install.test.mjs drives bash and the unix service layer;
      # install-windows.test.mjs is its counterpart and skips cleanly on Linux.
      # Each runs where it means something.
      - run: node test/install.test.mjs
        if: runner.os == 'Linux'
      - run: node test/install-windows.test.mjs
        if: runner.os == 'Windows'
